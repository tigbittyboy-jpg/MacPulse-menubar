name: macOS build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Core tests
        run: swift test --jobs 4
      - name: Native Xcode tests
        run: xcodebuild -project MacPulse.xcodeproj -scheme MacPulse -destination 'platform=macOS' -derivedDataPath build/TestData CODE_SIGNING_ALLOWED=NO test
      - name: Package application
        run: ./scripts/build-app.sh
      - name: Archive bundle
        run: ditto -c -k --keepParent build/MacPulse.app build/MacPulse-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacPulse-macOS
          path: build/MacPulse-macOS.zip
